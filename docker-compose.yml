services:
  juristwin:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      SECRET_KEY: ${SECRET_KEY:-replace-this-for-production}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Finals2026!}
      DATABASE_URL: sqlite:////data/juristwin.db
      RESOLVED_GAP_RETENTION_DAYS: ${RESOLVED_GAP_RETENTION_DAYS:-30}
      CORS_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
    volumes:
      - juristwin-data:/data
    restart: unless-stopped
volumes:
  juristwin-data:
