name: JurisTwin CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend
        run: pip install -r backend/requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend/app backend/scripts
      - name: Backend tests
        working-directory: backend
        run: pytest -q
      - name: Finals JavaScript syntax
        run: node --check backend/app/static/sentinel.js
      - name: Industry preflight
        working-directory: backend
        run: python scripts/industry_preflight.py --ci
