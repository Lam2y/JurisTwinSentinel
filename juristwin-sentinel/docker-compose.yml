services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: juristwin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d juristwin"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/juristwin
      SECRET_KEY: juristwin-docker-finals-secret
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
