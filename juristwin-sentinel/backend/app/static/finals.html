<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1,
            maximum-scale=1,
            user-scalable=no
        "
    >

    <title>JurisTwin Sentinel — Grand Finals</title>

    <!--
        Cache-busting is important.
        It prevents Chrome from reusing the broken v1.6 CSS.
    -->
    <link
        rel="stylesheet"
        href="/static/prototype.css?v=1.6.1"
    >
</head>

<body>

    <!-- Main 1440 × 1024 JurisTwin canvas -->
    <div id="jtViewport">
        <div
            id="jtStage"
            aria-live="polite"
        ></div>
    </div>


    <!-- =====================================================
         GRAND FINALS PRESENTATION CONTROLS
         ===================================================== -->

    <div
        id="jtPresentationControls"
        aria-label="Presentation controls"
    >

        <button
            id="jtZoomInBtn"
            class="jt-float-btn"
            title="Zoom in (+)"
            type="button"
        >
            +
        </button>

        <button
            id="jtZoomOutBtn"
            class="jt-float-btn"
            title="Zoom out (-)"
            type="button"
        >
            −
        </button>

        <button
            id="jtZoomResetBtn"
            class="jt-float-btn jt-float-wide"
            title="Fit screen (0)"
            type="button"
        >
            FIT
        </button>

        <button
            id="jtFullBtn"
            class="jt-float-btn"
            title="Fullscreen"
            type="button"
        >
            ⛶
        </button>

        <button
            id="jtContrastBtn"
            class="jt-float-btn"
            title="High contrast (C)"
            type="button"
        >
            C
        </button>

        <button
            id="jtFocusBtn"
            class="jt-float-btn"
            title="Focus / larger canvas (F)"
            type="button"
        >
            F
        </button>

        <button
            id="jtMotionBtn"
            class="jt-float-btn active"
            title="Motion on/off (M)"
            type="button"
        >
            M
        </button>

        <div
            id="jtZoomLabel"
            class="jt-zoom-label"
        >
            100%
        </div>
    </div>


    <!-- Toast notifications -->
    <div id="jtToast"></div>


    <!-- Modal container -->
    <div
        id="jtModal"
        class="jt-modal hidden"
    ></div>


    <!--
        v=1.6.1 forces Chrome to download the fixed JavaScript
        instead of returning 304 for the broken cached file.
    -->
    <script src="/static/app.js?v=1.6.1"></script>

</body>
</html>
